<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" class="v-svg layout-h net links name static" style="--p:1"><style>.v-svg{--bg:#fff;--surface:#f4f6f8;--surface-2:#e8ecf0;--border:#d6dce2;--fg:#171b1f;--muted:#4d565f;--accent:#0b6e63;--accent-strong:#085a50;--accent-soft:#dcf1ec;--line-muted:#7c868f;--font-sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}@media(prefers-color-scheme:dark){.v-svg{--bg:#0e1216;--surface:#161c22;--surface-2:#1e262d;--border:#2b353e;--fg:#e7eaed;--muted:#a7b0b9;--accent:#58d0bc;--accent-strong:#86e2d3;--accent-soft:#113b35;--line-muted:#6f7a84}}.v-svg{--p:0;font-family:var(--font-sans);stroke-linecap:round;stroke-linejoin:round}.v-svg *{transition:opacity .35s ease,stroke .35s ease}.v-svg text{text-anchor:middle;fill:var(--fg)}.v-svg .m{font-family:var(--font-mono)}.v-svg .b{font-weight:600}.v-svg .mu{fill:var(--muted)}.v-svg .as{fill:var(--accent-strong)}.v-place{fill:var(--surface-2);stroke:var(--border)}.v-svg .v-place-name{text-anchor:start;font-weight:600}.v-svg .v-nat{fill:var(--muted)}.v-svg .v-place-name,.v-svg .v-nat{paint-order:stroke;stroke:var(--surface-2);stroke-width:4px}.v-router rect{fill:var(--line-muted)}.v-router line{stroke:var(--line-muted);stroke-width:1.5}.v-node rect{fill:var(--bg);stroke:var(--line-muted);stroke-width:1.5}.v-net,.v-cloud,.v-dht,.v-rec,.v-link,.v-lock,.v-panel,.v-addr,.v-proxy,.v-service,.v-exit,.v-badge-exit,.v-badge-pub,.v-pkt,.v-place-name-alt{opacity:0}.v-net rect,.v-panel rect,.v-badge-exit rect,.v-badge-pub rect{fill:var(--accent-soft)}.v-cloud ellipse,.v-service rect{fill:var(--surface);stroke:var(--line-muted);stroke-width:1.5}.v-dht{fill:none;stroke:var(--line-muted);stroke-width:1.5;stroke-dasharray:4 5}.v-panel line,.v-addr line,.v-proxy line{stroke:var(--accent);stroke-width:1.5;stroke-dasharray:3 4}.v-addr rect,.v-proxy rect{fill:var(--bg);stroke:var(--accent);stroke-width:1.5}.v-rec,.v-pkt{fill:var(