    - heading "1. Install" [level=2] [ref=e40]
    - paragraph [ref=e41]: "As root on the router:"
    - generic [ref=e42]:
      - code [ref=e43]: wget -O- https://mesh-town.github.io/meshtown-openwrt/install.sh | sh
      - button "Copy command" [ref=e44] [cursor=pointer]: Copy
    - paragraph [ref=e45]: The service starts at boot.
    - heading "2. Join your network" [level=2] [ref=e46]
    - paragraph [ref=e47]: "A router node usually joins a network you already have. Ask a member for a single-use invite (Invite a member on their node page), then run this once while the service is stopped:"
    - generic [ref=e48]:
      - code [ref=e49]: /etc/init.d/meshtown stop meshtown run --config /etc/meshtown/config.json --invite mesh-invite2-…
      - button "Copy command" [ref=e50] [cursor=pointer]: Copy
    - paragraph [ref=e51]: The command saves the network to the settings file, so after a restart the service stays in the network without the invite. Stop it with Ctrl+C once it reports joining, then start the service. To share the router's web panel with the network, see the router notes.
    - paragraph [ref=e52]:
      - link "Router notes" [ref=e53] [cursor=pointer]:
        - /url: https://github.com/mesh-town/meshtown/blob/main/platforms/linux/build/openwrt/README.md
      - text: ·
      - link "Usage reference" [ref=e54] [cursor=pointer]:
        - /url: https://github.com/mesh-town/meshtown/blob/main/docs/USAGE.md
    - heading "3. Connect phones and computers" [level=2] [ref=e55]
    - paragraph [ref=e56]: Phones, tablets and computers on the router's home network open sites through Mesh Town once their Wi‑Fi or network settings point to the router's setup address (PAC). iPhone and iPad work this way too — there is no app for them.
    - paragraph [ref=e57]:
      - text: "First open the proxy for the home network: on the router's node page (port 7777) go through the setup steps and click \"Open for the home network\", or set"
      - code [ref=e58]: "\"socks\": {\"access\": \"localnet\"}"
      - text: in the settings file and restart the service.
    - paragraph [ref=e59]:
      - text: The setup address is
      - code [ref=e60]: http://<router address>:1080/proxy.pac
      - text: ", for example"
      - code [ref=e61]: http://192.168.1.1:1080/proxy.pac
      - text: . The node page shows the exact one.
    - list [ref=e62]:
      - listitem [ref=e63]: "iPhone and iPad: \"Settings\" → \"Wi‑Fi\" → ⓘ next to the network → \"Configure Proxy\" → \"Automatic\", paste the address into \"URL\", \"Save\"."
      - listitem [ref=e64]: "Android: Wi‑Fi settings → the network → \"Proxy\" → \"Proxy Auto-Config\", paste the address into \"PAC URL\", \"Save\"."
      - listitem [ref=e65]: "macOS: \"System Settings\" → \"Network\" → the connection → \"Details…\" → \"Proxies\" → \"Automatic Proxy Configuration\"."
      - listitem [ref=e66]: "Windows: \"Settings\" → \"Network & internet\" → \"Proxy\" → \"Use setup script\" → \"Script address\"."
      - listitem [ref=e67]: "Linux (GNOME): \"Settings\" → \"Network\" → \"Proxy\" → \"Automatic\" → \"Configuration URL\"."
    - paragraph [ref=e68]:
      - strong [ref=e69]: Note.
      - text: "The proxy has no password: any device on the home network can use it, and so can guest Wi‑Fi unless it is separated. Do not open port 1080 on the WAN side."
    - heading "Update" [level=2] [ref=e70]
    - paragraph [ref=e71]: "OpenWrt 24.10:"
    - generic [ref=e72]:
      - code [ref=e73]: opkg update && opkg upgrade meshtown
      - button "Copy command" [ref=e74] [cursor=pointer]: Copy
    - paragraph [ref=e75]: "OpenWrt 25.12:"
    - generic [ref=e76]:
      - code [ref=e77]: apk update && apk upgrade meshtown
      - button "Copy command" [ref=e78] [cursor=pointer]: Copy
